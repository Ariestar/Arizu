# docker-compose.yml
# NAPCAT_UID=$(id -u) NAPCAT_GID=$(id -g) docker-compose -f ./compose/astrbot.yml up -d
services:
  napcat:
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
      - MODE=astrbot
    ports:
      - 6099:6099
    container_name: napcat
    restart: always
    image: mlikiowa/napcat-docker:latest
    volumes:
      - ./data:/AstrBot/data
      - ./napcat/config:/app/napcat/config
      - ./ntqq:/app/.config/QQ
    networks:
      - astrbot_network
    #mac_address: "02:42:ac:11:00:02"
  astrbot:
    environment:
      - TZ=Asia/Shanghai
      - PLAYWRIGHT_BROWSERS_PATH=/AstrBot/data/playwright
      - PLAYWRIGHT_DOWNLOAD_HOST=https://npmmirror.com/mirrors/playwright/
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    ports:
      - "6185:6185"
      - "5000:5000"
      - "8000:8000"
      #- "6195:6195"
      #- "6199:6199"
    volumes:
      - ./data:/AstrBot/data
    networks:
      - astrbot_network
      # - wechat_net

  # WeChatPadPro (WPP) 服务
  # 这是一个将微信协议转换为 HTTP API 的中间件，配合 AstrBot 使用
  # 由于该项目较大，建议使用独立的 docker-compose 管理 (d:\Coding\Bot\ARIZU\WeChatPadPro\deploy\docker-compose.yml)
  # 这里保留 AstrBot 本体即可

networks:
  astrbot_network:
    driver: bridge
  # wechat_net:
  #   external: true
  #   name: wechatpadpro-network
